<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Chess Notation</title>
  <style>
    :root {
      --bg: #e4e4e4;
      --card: #ececec;
      --border: #c0c0c0;
      --text: #222;
      --muted: #666;
      --btn: #d8d8d8;
      --btn-h: #c8c8c8;
      --accent: #3a6ea5;
      --accent-h: #2c5282;
      --danger: #a33;
      --input: #e0e0e0;
    }
    [data-theme="dark"] {
      --bg: #1a1a1a;
      --card: #2a2a2a;
      --border: #444;
      --text: #ddd;
      --muted: #999;
      --btn: #333;
      --btn-h: #404040;
      --accent: #4a90d9;
      --accent-h: #3182ce;
      --danger: #e06060;
      --input: #2e2e2e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 10px;
      transition: background .15s, color .15s;
    }
    .topbar { display: flex; justify-content: flex-end; margin-bottom: 6px; }
    #themeBtn {
      padding: 5px 10px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--card);
      color: var(--text);
      font-size: .8rem;
      cursor: pointer;
    }
    h1 { text-align: center; font-size: 1.25rem; font-weight: 600; margin-bottom: 8px; }
    .wrap { max-width: 420px; margin: 0 auto; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
    }
    .card h2 {
      font-size: .65rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-bottom: 6px;
    }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    label { display: block; font-size: .7rem; color: var(--muted); margin-bottom: 1px; }
    input[type="text"], input[type="date"], select {
      width: 100%;
      padding: 6px 7px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: .85rem;
      background: var(--input);
      color: var(--text);
    }
    #current {
      text-align: center;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 1.4rem;
      font-weight: 600;
      padding: 10px;
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 8px;
      min-height: 48px;
      letter-spacing: 1px;
    }

    .pad { display: grid; gap: 4px; margin-bottom: 6px; }
    .pad.files, .pad.ranks { grid-template-columns: repeat(8, 1fr); }
    .pad.pieces { grid-template-columns: repeat(6, 1fr); }
    .pad.special { grid-template-columns: repeat(4, 1fr); }
    .pad button {
      padding: 10px 0;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--btn);
      color: var(--text);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      font-family: ui-monospace, Consolas, monospace;
    }
    .pad button:hover { background: var(--btn-h); }
    .pad button:active { filter: brightness(0.9); }
    .pad.special button { font-size: .8rem; padding: 9px 0; }

    #error {
      color: var(--danger);
      font-size: .85rem;
      min-height: 1.2em;
      text-align: center;
      margin-bottom: 4px;
    }

    #moves {
      min-height: 90px;
      max-height: 140px;
      overflow-y: auto;
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      font-family: ui-monospace, Consolas, monospace;
      font-size: .9rem;
      line-height: 1.55;
      white-space: pre-wrap;
    }

    .row { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
    button.action {
      flex: 1;
      min-width: 65px;
      padding: 8px 6px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--card);
      color: var(--text);
      font-size: .8rem;
      cursor: pointer;
    }
    button.action.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    button.action.primary:hover { background: var(--accent-h); }
    button.action.danger { color: var(--danger); }

    #pgnOut {
      width: 100%;
      height: 90px;
      font-family: ui-monospace, Consolas, monospace;
      font-size: .75rem;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 7px;
      background: var(--input);
      color: var(--text);
      resize: vertical;
    }
    .foot { text-align: center; font-size: .65rem; color: var(--muted); margin-top: 4px; }
    @media (max-width: 400px) {
      .grid2 { grid-template-columns: 1fr; }
      .pad button { padding: 9px 0; font-size: .9rem; }
    }
  </style>
</head>
<body>
  <div class="topbar"><button id="themeBtn">Dark</button></div>
  <h1>Chess Notation</h1>
  <div class="wrap">

    <div class="card">
      <h2>Game Info</h2>
      <div class="grid2">
        <div><label>Event</label><input type="text" id="event"></div>
        <div><label>Site</label><input type="text" id="site"></div>
        <div><label>White</label><input type="text" id="white"></div>
        <div><label>Black</label><input type="text" id="black"></div>
        <div><label>Round</label><input type="text" id="round"></div>
        <div><label>Date</label><input type="date" id="date"></div>
        <div><label>Time Control</label><input type="text" id="timeControl"></div>
        <div><label>Result</label><select id="result">
          <option value="*" selected>*</option>
          <option value="1-0">1-0</option>
          <option value="0-1">0-1</option>
          <option value="1/2-1/2">1/2-1/2</option>
        </select></div>
      </div>
    </div>

    <input type="text" id="current" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Current move">
    <div id="error"></div>

    <div class="row">
      <button class="action" id="backspace">⌫</button>
      <button class="action" id="clearMove">Clear</button>
      <button class="action primary" id="submit">Enter Move</button>
    </div>

    <div class="card">
      <h2>Piece</h2>
      <div class="pad pieces">
        <button data-v="">P</button>
        <button data-v="N">N</button>
        <button data-v="B">B</button>
        <button data-v="R">R</button>
        <button data-v="Q">Q</button>
        <button data-v="K">K</button>
      </div>
      <h2>File</h2>
      <div class="pad files">
        <button data-v="a">a</button><button data-v="b">b</button>
        <button data-v="c">c</button><button data-v="d">d</button>
        <button data-v="e">e</button><button data-v="f">f</button>
        <button data-v="g">g</button><button data-v="h">h</button>
      </div>
      <h2>Rank</h2>
      <div class="pad ranks">
        <button data-v="1">1</button><button data-v="2">2</button>
        <button data-v="3">3</button><button data-v="4">4</button>
        <button data-v="5">5</button><button data-v="6">6</button>
        <button data-v="7">7</button><button data-v="8">8</button>
      </div>
      <h2>Special</h2>
      <div class="pad special">
        <button data-v="x">x</button>
        <button data-v="=">=</button>
        <button data-v="+">+</button>
        <button data-v="#">#</button>
        <button data-v=" e.p.">e.p.</button>
        <button data-v="O-O">O-O</button>
        <button data-v="O-O-O">O-O-O</button>
      </div>
    </div>

    <div class="card">
      <h2>Moves</h2>
      <div id="moves">No moves yet</div>
    </div>

    <div class="row">
      <button class="action" id="resign">Resign</button>
      <button class="action" id="draw">Draw</button>
      <button class="action" id="undo">Undo</button>
      <button class="action danger" id="reset">Reset</button>
    </div>
    <div class="row">
      <button class="action primary" id="exportPgn">Download PGN</button>
      <button class="action" id="copyPgn">Copy PGN</button>
    </div>

    <div class="card">
      <h2>PGN</h2>
      <textarea id="pgnOut" readonly></textarea>
    </div>
    <div class="foot">exd6 · e8=Q · Qh5+ · O-O · buttons only · legal moves enforced</div>
  </div>

  <script>
    const game = new Chess();
    let buf = '';
    window._ended = false;
    let dateUserSet = false;

    const currentEl = document.getElementById('current');
    const errorEl = document.getElementById('error');
    const movesEl = document.getElementById('moves');
    const pgnOut = document.getElementById('pgnOut');

    const themeBtn = document.getElementById('themeBtn');
    function setTheme(t) {
      document.documentElement.setAttribute('data-theme', t);
      themeBtn.textContent = t === 'dark' ? 'Light' : 'Dark';
      localStorage.setItem('cn-theme', t);
    }
    setTheme(localStorage.getItem('cn-theme') || 'light');
    themeBtn.addEventListener('click', () => {
      setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });

    const desktopKeyboard = window.matchMedia('(pointer: fine)').matches;

    function focusMoveInput() {
      if (desktopKeyboard) currentEl.focus();
    }

    function showBuf() {
      currentEl.value = buf;
      currentEl.setSelectionRange(currentEl.value.length, currentEl.value.length);
    }

    function append(v) {
      if (v === 'O-O' || v === 'O-O-O') buf = v;
      else buf += v;
      errorEl.textContent = '';
      showBuf();
      focusMoveInput();
    }

    currentEl.addEventListener('input', () => {
      buf = currentEl.value;
      errorEl.textContent = '';
    });

    currentEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        submitMove();
      } else if (e.key === 'Escape') {
        e.preventDefault();
        buf = '';
        errorEl.textContent = '';
        showBuf();
      }
    });

    document.querySelectorAll('.pad button').forEach(btn => {
      btn.addEventListener('click', () => append(btn.dataset.v));
    });

    document.getElementById('backspace').addEventListener('click', () => {
      if (buf === 'O-O' || buf === 'O-O-O') buf = '';
      else buf = buf.slice(0, -1);
      errorEl.textContent = '';
      showBuf();
      focusMoveInput();
    });

    document.getElementById('clearMove').addEventListener('click', () => {
      buf = '';
      errorEl.textContent = '';
      showBuf();
      focusMoveInput();
    });


    function saveState() {
      const state = {
        pgn: game.pgn(),
        headers: {
          event: document.getElementById('event').value,
          site: document.getElementById('site').value,
          round: document.getElementById('round').value,
          white: document.getElementById('white').value,
          black: document.getElementById('black').value,
          date: dateUserSet ? document.getElementById('date').value : '',
          dateUserSet: dateUserSet,
          timeControl: document.getElementById('timeControl').value,
          result: document.getElementById('result').value
        },
        ended: !!window._ended,
        buf: buf
      };
      localStorage.setItem('cn-game', JSON.stringify(state));
    }

    function loadState() {
      try {
        const raw = localStorage.getItem('cn-game');
        if (!raw) return false;
        const state = JSON.parse(raw);
        if (state.headers) {
          document.getElementById('event').value = state.headers.event || '';
          document.getElementById('site').value = state.headers.site || '';
          document.getElementById('round').value = state.headers.round || '';
          document.getElementById('white').value = state.headers.white || '';
          document.getElementById('black').value = state.headers.black || '';
          dateUserSet = state.headers.dateUserSet === true;
          document.getElementById('date').value = dateUserSet ? (state.headers.date || '') : '';
          document.getElementById('timeControl').value = state.headers.timeControl || '';
          document.getElementById('result').value = ['1-0','0-1','1/2-1/2','*'].includes(state.headers.result) ? state.headers.result : '*';
        }
        game.reset();
        if (state.pgn) {
          // load_pgn restores moves; headers may be overwritten so re-apply after
          game.load_pgn(state.pgn, { sloppy: true });
        }
        window._ended = !!state.ended;
        buf = state.buf || '';
        showBuf();
        if (!window._ended) updateGameState();
        updateMoves();
        updatePgn();
        return true;
      } catch (e) {
        console.warn('load failed', e);
        return false;
      }
    }

    function submitMove() {
      if (!buf) return;
      if (window._ended || game.game_over()) {
        errorEl.textContent = 'Game over';
        return;
      }
      errorEl.textContent = '';
      // strip optional e.p. for parser; chess.js does not need it
      let san = buf.replace(/\s*e\.p\.\s*$/i, '');
      const move = game.move(san, { sloppy: true });
      if (move === null) {
        errorEl.textContent = 'Illegal: ' + buf;
        return;
      }
      buf = '';
      showBuf();
      updateAll();
      saveState();
      focusMoveInput();
    }

    document.getElementById('submit').addEventListener('click', submitMove);

    function updateGameState() {
      if (window._ended) return;
      if (game.in_checkmate()) {
        document.getElementById('result').value = game.turn() === 'w' ? '0-1' : '1-0';
      } else if (game.in_draw() || game.in_stalemate() || game.in_threefold_repetition() || game.insufficient_material()) {
        document.getElementById('result').value = '1/2-1/2';
      }
    }

    function updateMoves() {
      const h = game.history();
      if (!h.length) { movesEl.textContent = 'No moves yet'; return; }
      let t = '';
      for (let i = 0; i < h.length; i += 2) {
        t += (Math.floor(i/2)+1) + '. ' + h[i];
        if (h[i+1]) t += '   ' + h[i+1];
        t += '\n';
      }
      movesEl.textContent = t;
    }

    function toPgnTimeControl(value) {
      const v = value.trim();
      if (!v) return '';
      const m = v.match(/^(\d+)\s*\+\s*(\d+)$/);
      if (m) return (parseInt(m[1], 10) * 60) + '+' + parseInt(m[2], 10);
      return v;
    }

    function buildPgn() {
      const tcInput = document.getElementById('timeControl').value.trim();
      game.header(
        'Event',  document.getElementById('event').value.trim() || '?',
        'Site',   document.getElementById('site').value.trim() || '?',
        'Date',   (document.getElementById('date').value || '').replace(/-/g,'.') || '????.??.??',
        'Round',  document.getElementById('round').value || '?',
        'White',  document.getElementById('white').value.trim() || '?',
        'Black',  document.getElementById('black').value.trim() || '?',
        'Result', document.getElementById('result').value || '*',
        'TimeControl', toPgnTimeControl(tcInput) || '?'
      );
      let pgn = game.pgn({ max_width: 70, newline_char: '\n' });
      if (!tcInput) pgn = pgn.replace(/^\[TimeControl ".*"\]\n?/m, '');
      return pgn;
    }

    function updatePgn() { pgnOut.value = buildPgn(); }

    function updateAll() {
      updateGameState();
      updateMoves();
      updatePgn();
    }

    document.getElementById('resign').addEventListener('click', () => {
      if (window._ended || game.game_over()) return;
      if (!confirm('Resign for the side to move?')) return;
      const result = game.turn() === 'w' ? '0-1' : '1-0';
      document.getElementById('result').value = result;
      window._ended = true;
      buf = '';
      showBuf();
      updatePgn();
      saveState();
    });

    document.getElementById('draw').addEventListener('click', () => {
      if (window._ended || game.game_over()) return;
      if (!confirm('Agree to draw?')) return;
      document.getElementById('result').value = '1/2-1/2';
      window._ended = true;
      buf = '';
      showBuf();
      updatePgn();
      saveState();
    });

    document.getElementById('undo').addEventListener('click', () => {
      if (window._ended) {
        window._ended = false;
      } else {
        game.undo();
      }
      document.getElementById('result').value = '*';
      buf = '';
      errorEl.textContent = '';
      showBuf();
      updateAll();
      saveState();
    });

    document.getElementById('reset').addEventListener('click', () => {
      if (!confirm('Reset game?')) return;
      game.reset();
      window._ended = false;
      buf = '';
      document.getElementById('result').value = '*';
      dateUserSet = false;
      document.getElementById('date').value = '';
      errorEl.textContent = '';
      showBuf();
      updateAll();
      localStorage.removeItem('cn-game');
    });

    document.getElementById('exportPgn').addEventListener('click', () => {
      const blob = new Blob([buildPgn()], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = (document.getElementById('white').value || 'White') + '_vs_' +
                   (document.getElementById('black').value || 'Black') + '.pgn';
      a.click();
      URL.revokeObjectURL(a.href);
    });

    document.getElementById('copyPgn').addEventListener('click', () => {
      navigator.clipboard.writeText(buildPgn()).then(() => alert('PGN copied'))
        .catch(() => { pgnOut.select(); document.execCommand('copy'); alert('PGN copied'); });
    });

    ['event','site','round','white','black','timeControl','result'].forEach(id =>
      document.getElementById(id).addEventListener('input', () => { updatePgn(); saveState(); })
    );

    document.getElementById('date').addEventListener('input', () => {
      dateUserSet = document.getElementById('date').value !== '';
      updatePgn();
      saveState();
    });

    showBuf();
    if (!loadState()) {
      dateUserSet = false;
      document.getElementById('date').value = '';
      updateAll();
    } else saveState();
    focusMoveInput();
  </script>
</body>
</html>
